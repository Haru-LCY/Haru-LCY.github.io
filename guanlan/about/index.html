    <header class="about-title"><h1>觀瀾齋主人</h1></header>
    <article class="about-prose" aria-label="齋主自述"><p>此處並非現實，卻也並非異鄉。</p>

<p>這裡是觀瀾齋。無磚瓦，無梁柱，唯憑一念而存。</p>

<p>齋主瑾瑜當年，一介終日耽於幻想之人。生於丙戌之春，長於濱城大連。</p>

<p>如今離鄉遠遊，只得夢中觀瀾。</p>

<p>世人以所見為真，所夢為假。然記憶既能為其作證，亦能將其篡改。</p>

<p>夢與現實，未必判然。</p>

<p>趁我尚能作夢，且將夢中種種，留存於此。</p>
</article>
