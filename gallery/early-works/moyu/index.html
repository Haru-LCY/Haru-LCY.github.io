  <h1 id="section">摸鱼儿</h1>

  <p class="gallery-essay__date"><span class="gallery-essay__author">Chunyu Liu</span> · <time datetime="2019-08-28">2019-8-28</time> 于泸沽湖</p>

  <p class="gallery-essay__poem">
翠枝摇，碧空如洗，泸沽湖上初霁。<br />
烟波浩渺留人醉，莺啭雀鸣如呓。<br />
山色丽，柳似翡。丝丝细浪生秋水。<br />
泛舟于此，见雨后波平，鱼来藻密，<br />
亦有苍苍苇。
</p>

  <p class="gallery-essay__poem">
薄云起，晓雾岚烟旖旎。层峦叠嶂迢递。<br />
青松细叶皆青绮，时有鸟啼獒吠。<br />
泉浄泚，石滩浅。小村古韵犹凝粹。<br />
群芳斗媚。临崖畔观澜，神怡心旷，<br />
只感山河美。
</p>
