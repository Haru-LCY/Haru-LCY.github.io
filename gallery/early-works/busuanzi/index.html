  <p class="gallery-essay__poem">
岁月似歌悠，美景如烟散。<br />
犹忆当年陌上逢，日暖天明灿。<br />
又是一经年，噪晚蝉鸣乱。<br />
唯愿卿能永忘忧，总有欢愉伴。
</p>
