  <h1 id="section">沁园春</h1>

  <p class="gallery-essay__date"><span class="gallery-essay__author">Chunyu Liu</span> · <time datetime="2019-08-29">2019-8-29</time> 于玉龙雪山</p>

  <p class="gallery-essay__poem">
何处相逢，访蓝月谷，登玉龙山。<br />
见雪生叠嶂，雾环远岫，水缠崖涧，云绕层峦。<br />
川隐烟波，浑如画卷，时有啾啾鸟雀喧。<br />
临峰顶，见诸丘若岛，举手即天。
</p>

  <p class="gallery-essay__poem">
湖光山色斑斓。回首处，碧涛声正繁。<br />
望深潭瀑布，斑驳树影，牦牛小憩，翠水绵绵。<br />
仙界风光，不知何故，落此人间雪域边。<br />
观湖景，听潮音阵阵，忘世轻欢。
</p>
