  <p class="gallery-essay__date"><span class="gallery-essay__author">Chunyu Liu &amp; 瑾瑜當年</span> · <time datetime="2020-04-06">2020-4-6</time></p>

  <p class="gallery-essay__poem">
草青日暖樱如雪，船橹蹁跹。风起微澜。何处何人放纸鸢。
</p>

  <p class="gallery-essay__poem">
苦寒退散瘟神祛，蝶戏花间。燕舞屋前。疫疠得除天下欢。
</p>
