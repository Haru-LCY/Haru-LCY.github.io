  <h1 id="section">临江仙 除夕</h1>

  <p class="gallery-essay__date"><span class="gallery-essay__author">瑾瑜當年</span> · <time datetime="2021-02-11">2021-2-11</time></p>

  <p class="gallery-essay__poem">
火树银花漫舞，万家灯火通明。<br />
金觥佳酿酒香萦。玉盘盛海味，时有异香生。
</p>

  <p class="gallery-essay__poem">
转瞬三年已去，今朝辛丑来迎。<br />
忆今丁酉遇群英。而今将四散，只盼流年停。
</p>
